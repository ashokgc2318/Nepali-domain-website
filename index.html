<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>जिल्ला प्रहरी कार्यालय, रुपन्देही | CDR Analysis Portal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- Header Section -->
    <header class="dpo-header text-center py-4">
        <div class="container d-flex align-items-center justify-content-center gap-3">
            <div>
                <h1 class="nepali-title m-0">जिल्ला प्रहरी कार्यालय, रुपन्देही</h1>
                <h3 class="portal-subtitle m-0">District Police Office, Rupandehi — CDR Analysis System</h3>
            </div>
        </div>
    </header>

    <div class="container my-4">
        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></Here is the complete codebase to build and run the web-based **Call Detail Record (CDR) Analysis Portal** for **जिल्ला प्रहरी कार्यालय, रुपन्देही** (District Police Office, Rupandehi).

This application allows officers to choose between NTC and NCELL, upload CDR Excel sheets along with cell tower parameters, automatically execute data cleaning and VLOOKUP matching, present critical target metrics/charts, and generate cleaned Excel reports for download.
